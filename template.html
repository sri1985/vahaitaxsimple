<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <!-- Mobile app feel: zoom disabled per brief. Layout uses fluid type, 48px targets. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="format-detection" content="telephone=no">
  <meta name="author" content="VAHAI TAX - Accountants and Consultants">

  {{canonical_link}}
  {{hreflang_links}}

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="VAHAI TAX - Accountants and Consultants">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta name="keywords" content="Accounting, Scarborough, CPA, Tax Returns, Bookkeeping, Payroll, GST, HST, Incorporation, T1, T2, CRA Audit, Financial Statements">
  <meta property="og:locale" content="{{og_locale}}">
  {{og_locale_alt}}
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">

  <link rel="icon" href="{{base}}/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{css_href}}">
  <noscript>
    <!-- Without JavaScript the drawer menu is shown as a static block under the bar. -->
    <style>
      .drawer{position:static;visibility:visible;transform:none;display:block;overflow:visible}
      #menu-toggle{display:none}
    </style>
  </noscript>

  {{json_ld}}
</head>
<body class="bg-appbg text-ink font-sans selection:bg-vahai-green/20">
  <a class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:bg-ink focus:text-white focus:px-4 focus:py-2 focus:rounded" href="#main">{{t:skip}}</a>

  <!-- Floating Header -->
  <header class="fixed top-2 md:top-4 inset-x-0 z-50 pointer-events-none px-2 md:px-4 lg:px-8">
    <div class="mx-auto max-w-page pointer-events-auto">
      <div class="flex items-center justify-between h-[46px] max-h-[46px] md:h-[72px] md:max-h-[72px] rounded-full bg-white/95 backdrop-blur-xl border border-slate-200 px-3 md:px-4 lg:px-6 shadow-md shadow-slate-200/50">
        
        <!-- Logo -->
        <a href="{{home_href}}" class="flex items-center gap-2 md:gap-3 shrink-0" aria-label="{{t:brand_aria}}">
          <img src="{{base}}/assets/vahaiwebp.webp" alt="Vahai Tax Logo" class="h-6 md:h-10 w-auto">
          <span class="font-serif text-[13px] md:text-[18px] font-bold tracking-wide text-ink sm:block">VAHAI TAX</span>
        </a>

        <!-- Desktop Nav -->
        <nav aria-label="{{t:nav_primary}}" class="hidden lg:flex flex-1 justify-center">
          {{nav_desktop}}
        </nav>

        <!-- Right Side: Contact / Mobile Toggle -->
        <div class="flex items-center shrink-0 gap-3">
          <div class="hidden lg:block">{{lang_toggle}}</div>
          <a href="tel:{{phone1_tel}}" class="hidden md:inline-flex items-center justify-center h-10 px-6 rounded-full bg-vahai-orange text-white text-sm font-bold shadow-md hover:bg-vahai-orange-dark transition-colors">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
            {{phone1}}
          </a>
          <button id="menu-toggle" class="lg:hidden flex items-center justify-center w-8 h-8 md:w-10 md:h-10 rounded-full bg-slate-100 text-ink hover:bg-slate-200 transition-colors shrink-0" aria-expanded="false" aria-controls="drawer" data-label-open="Open Menu" data-label-close="Close Menu">
            <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </div>
        
      </div>
    </div>
  </header>

  <!-- Mobile Drawer -->
  <div id="drawer" class="fixed inset-0 z-40 bg-white invisible opacity-0 transition-all duration-300 pointer-events-none pt-[100px] overflow-y-auto">
    <div class="px-6 pb-20">
      <nav aria-label="Mobile Navigation">
        <!-- We will populate this from nav_drawer, but for now we just show desktopNav via CSS trick or implement drawerNav -->
        {{nav_drawer}}
      </nav>
    </div>
  </div>

  <main id="main" class="pt-24 lg:pt-32">
    {{content}}
  </main>
  
  {{footer_nav}}
  {{nav_bottom_bar}}
  
  <script src="{{js_src}}" defer></script>
</body>
</html>
